name: Publish Aqari Pro static demo to GitHub Pages
on:
  push:
    branches: [feature/production-foundation]
    paths:
      - ".github/workflows/pages-demo.yml"
      - "index.html"
      - "app.js"
      - "attachments.js"
      - "tests/demo-attachments-browser.cjs"
      - "tests/demo-journey-browser.cjs"
      - "demo-finance.js"
      - "demo-backup.js"
      - "tests/demo-backup.test.cjs"
      - "tests/demo-finance.test.cjs"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish-demo:
    runs-on: ubuntu-latest
    environment:
      name: aqari-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone demo and build public-only artifact
        run: |
          set -euo pipefail
          node --check app.js
          node --check attachments.js
          node --check demo-finance.js
          node --check demo-backup.js
          node tests/demo-backup.test.cjs
          node tests/demo-finance.test.cjs
          # Prevent a public demo from becoming indistinguishable from a live service.
          grep -q 'demo-warning' index.html
          grep -q 'لا ترفع صكوكًا أو هويات أو عقودًا حقيقية' index.html
          grep -q 'محاكاة' index.html
          if grep -Eq 'src=["\x27]/backend/|href=["\x27]/backend/' index.html; then
            echo "Refusing to publish backend-linked paths in the public demo" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/aqari-public-demo"
          cp index.html app.js attachments.js demo-finance.js demo-backup.js .nojekyll "$RUNNER_TEMP/aqari-public-demo/"
          test -s "$RUNNER_TEMP/aqari-public-demo/index.html"
          test ! -e "$RUNNER_TEMP/aqari-public-demo/backend"
          test ! -e "$RUNNER_TEMP/aqari-public-demo/.env"
      - name: Install Chromium browser test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test attachments in a real Chromium browser
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/aqari-public-demo" > "$RUNNER_TEMP/demo-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 1
          done
          node tests/demo-attachments-browser.cjs
          node tests/demo-journey-browser.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/aqari-public-demo
      - name: Publish demonstration only (no Laravel API)
        id: deployment
        uses: actions/deploy-pages@v4
