name: Staging Container Integration

on:
  push:
    branches: [main]
    paths:
      - 'backend/app/**'
      - 'backend/bootstrap/**'
      - 'backend/config/**'
      - 'backend/database/migrations/**'
      - 'backend/routes/**'
      - 'backend/frontend/**'
      - 'backend/tests/browser/**'
      - 'backend/deploy/staging/**'
      - 'backend/deploy/local/**'
      - '.devcontainer/**'
      - '.dockerignore'
      - '.github/workflows/staging-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create ephemeral staging settings
        run: |
          umask 077
          {
            echo 'AQARI_DOMAIN=staging.example.test'
            echo 'AQARI_DB_PASSWORD=ci_disposable_staging_password_43'
            printf 'AQARI_APP_KEY=base64:%s\n' "$(openssl rand -base64 32)"
            echo 'AQARI_STATEFUL_PORT_SUFFIX=:18443'
            echo 'AQARI_CI_SCANNER_BINARY=/tmp/aqari-ci-clamscan'
          } > backend/deploy/staging/.env.staging

      - name: Verify local-only Docker Compose safety and Bash launcher syntax
        run: |
          set -euo pipefail
          bash -n backend/deploy/local/start.sh
          docker compose --env-file backend/deploy/staging/.env.staging \
            -f backend/deploy/local/compose.yaml config --quiet
          docker compose --env-file backend/deploy/staging/.env.staging \
            -f backend/deploy/local/compose.yaml config --format json \
            | python3 -c '
          import json,sys
          services=json.load(sys.stdin)["services"]
          assert not services["db"].get("ports"), "PostgreSQL must not publish a host port"
          ports=services["app"]["ports"]
          assert len(ports)==1 and ports[0].get("host_ip")=="127.0.0.1", "Local HTTP must bind loopback only"
          assert str(ports[0].get("published"))=="8080", "Unexpected local HTTP port"
          assert services["app"]["environment"]["APP_ENV"]=="local", "Must run in local mode"
          assert services["app"]["environment"]["SESSION_SECURE_COOKIE"]=="false", "Loopback HTTP cookie must not require HTTPS"
          assert services["app"]["environment"]["MAIL_MAILER"]=="log", "Local mail must remain non-delivering"
          print("Local-only Docker Compose safety checks passed.")
          '

      - name: Validate GitHub Codespaces private HTTPS origin and startup
        env:
          AQARI_CODESPACES_HOST: aqari-ci-8080.app.github.dev
          AQARI_CODESPACES_APP_URL: https://aqari-ci-8080.app.github.dev
        run: |
          set -euo pipefail
          bash -n .devcontainer/start-codespace.sh
          bash -n backend/deploy/local/start.sh
          python3 - <<'PY'
          import json
          with open('.devcontainer/devcontainer.json', encoding='utf-8') as f:
              c = json.load(f)
          assert c['forwardPorts'] == [8080]
          assert any('docker-in-docker' in name for name in c['features'])
          assert c['postStartCommand'] == 'bash .devcontainer/start-codespace.sh'
          assert c['portsAttributes']['8080']['protocol'] == 'http'
          print('Codespaces devcontainer syntax and Docker feature validated.')
          PY
          if bash .devcontainer/start-codespace.sh > /dev/null 2>&1; then
            echo 'Codespaces launcher must reject running outside Codespaces' >&2
            exit 1
          fi
          docker compose --env-file backend/deploy/staging/.env.staging \
            -f backend/deploy/local/compose.yaml \
            -f .devcontainer/compose.codespaces.yaml config --quiet
          docker compose --env-file backend/deploy/staging/.env.staging \
            -f backend/deploy/local/compose.yaml \
            -f .devcontainer/compose.codespaces.yaml config --format json \
            | python3 -c '
          import json,sys
          services=json.load(sys.stdin)["services"]
          for name in ["app","migrate"]:
              env=services[name]["environment"]
              assert env["APP_URL"]=="https://aqari-ci-8080.app.github.dev"
              assert env["SANCTUM_STATEFUL_DOMAINS"]=="aqari-ci-8080.app.github.dev"
              assert env["SESSION_SECURE_COOKIE"]=="true"
          assert not services["db"].get("ports")
          p=services["app"]["ports"]
          assert len(p)==1 and p[0].get("host_ip")=="127.0.0.1"
          print("Private Codespaces HTTPS session and database isolation validated.")
          '

      - name: Validate Compose and HTTPS proxy syntax
        run: |
          docker compose --env-file backend/deploy/staging/.env.staging \
            -f backend/deploy/staging/compose.yaml config --quiet
          docker run --rm \
            -e AQARI_DOMAIN=staging.example.test \
            -v "$PWD/backend/deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate \
            --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build and start isolated Laravel staging
        run: |
          docker compose --env-file backend/deploy/staging/.env.staging \
            -f backend/deploy/staging/compose.yaml \
            up --detach --build --wait db migrate app

      - name: Verify Laravel health, access isolation and staged UI
        run: |
          set -euo pipefail
          compose=(docker compose --env-file backend/deploy/staging/.env.staging \
            -f backend/deploy/staging/compose.yaml)
          "${compose[@]}" exec -T app php artisan route:list --path=api
          "${compose[@]}" exec -T app curl --fail --silent http://127.0.0.1/up > /dev/null
          "${compose[@]}" exec -T app curl --fail --silent http://127.0.0.1/staging/ | grep -q 'عقاري برو'
          status=$("${compose[@]}" exec -T app curl --silent --output /dev/null \
            --write-out '%{http_code}' --header 'Accept: application/json' \
            http://127.0.0.1/api/v1/properties)
          test "$status" = 401
          echo 'Staging health, first-party UI and guest API isolation passed.'

      - name: Seed isolated synthetic owner accounts
        env:
          AQARI_E2E_PASSWORD: "SyntheticOnlyPass!2026"
        run: |
          docker compose --env-file backend/deploy/staging/.env.staging \
            -f backend/deploy/staging/compose.yaml \
            exec -T -e AQARI_E2E_ONLY=1 \
            -e "AQARI_E2E_PASSWORD=$AQARI_E2E_PASSWORD" \
            app php < backend/tests/browser/seed-ci-owner.php

      - name: Start loopback-only HTTPS Caddy using an ephemeral internal CA
        run: |
          docker run --detach --name aqari-ci-https \
            --network aqari-staging_private \
            --publish 127.0.0.1:18443:443 \
            --volume "$PWD/backend/deploy/staging/Caddyfile.ci:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine
          echo "127.0.0.1 staging.example.test" | sudo tee -a /etc/hosts >/dev/null
          for retry in $(seq 1 30); do
            if curl --noproxy '*' -ksf https://staging.example.test:18443/up >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --noproxy '*' -ksf https://staging.example.test:18443/staging/ >/dev/null

      - name: Install Playwright Chromium for real browser testing
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
          # GitHub Ubuntu runners already include Chromium runtime libraries.
          # Avoid network-dependent apt package mirrors during this CI step.
          npx playwright install chromium

      - name: Install isolated CI-only synthetic file scanner
        run: |
          docker compose --env-file backend/deploy/staging/.env.staging \
            -f backend/deploy/staging/compose.yaml \
            cp backend/tests/browser/ci-scanner-stub.sh app:/tmp/aqari-ci-clamscan
          docker compose --env-file backend/deploy/staging/.env.staging \
            -f backend/deploy/staging/compose.yaml \
            exec -T -u root app chmod 755 /tmp/aqari-ci-clamscan
          echo 'This synthetic scanner is permitted ONLY in disposable CI; ClamAV is required on the real host.'

      - name: Browser E2E — authenticated owner contract-to-cash journey
        env:
          AQARI_E2E_PASSWORD: "SyntheticOnlyPass!2026"
        run: node backend/tests/browser/staging-flow.cjs

      - name: Boot the actual localhost stack with disposable PostgreSQL
        run: |
          set -euo pipefail
          docker compose --env-file backend/deploy/staging/.env.staging \
            -f backend/deploy/local/compose.yaml up --detach --build --wait db migrate app
          curl --noproxy '*' --fail --silent --show-error http://127.0.0.1:8080/up >/dev/null
          curl --noproxy '*' --fail --silent --show-error http://127.0.0.1:8080/staging/ \
            | grep -q 'عقاري برو'
          code="$(curl --noproxy '*' --silent --output /dev/null \
            --write-out '%{http_code}' --header 'Accept: application/json' \
            http://127.0.0.1:8080/api/v1/properties)"
          test "$code" = 401
          echo 'Localhost Docker service, first-party UI and guest access isolation passed.'

      - name: Remove disposable localhost stack
        if: always()
        run: |
          docker compose --env-file backend/deploy/staging/.env.staging \
            -f backend/deploy/local/compose.yaml down --volumes --remove-orphans || true

      - name: Inspect container status on failure
        if: failure()
        run: |
          docker compose --env-file backend/deploy/staging/.env.staging \
            -f backend/deploy/staging/compose.yaml ps -a || true
          docker compose --env-file backend/deploy/staging/.env.staging \
            -f backend/deploy/staging/compose.yaml logs --no-color --tail=80 app migrate db || true

      - name: Remove ephemeral staging environment
        if: always()
        run: |
          docker rm -f aqari-ci-https 2>/dev/null || true
          docker compose --env-file backend/deploy/staging/.env.staging \
            -f backend/deploy/staging/compose.yaml down --volumes --remove-orphans || true
          rm -f backend/deploy/staging/.env.staging
