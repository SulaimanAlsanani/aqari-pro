name: Deploy Aqari Pro to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check finance.js
          node --check contracts.js
          node --check followups.js
          node --check statements.js
          node --check receipts.js
          node --check reconciliation.js
          node --check maintenance.js
          node --check app.js
          node --check attachments.js
      - name: Test financial regression cases
        run: node --test tests/*.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
