name: Deploy Aqari Pro to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check finance.js
          node --check contracts.js
          node --check followups.js
          node --check statements.js
          node --check receipts.js
          node --check reconciliation.js
          node --check maintenance.js
          node --check app.js
          node --check attachments.js
          node --check backend/frontend/api-session.js
          node --check backend/frontend/staging-app.js
          node --check backend/frontend/finance-staging.js
          node --check backend/frontend/attachment-staging.js
      - name: Test financial regression cases
        run: node --test tests/*.test.cjs
      - name: Validate PHP backend source syntax
        run: |
          find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Stage and audit public frontend only
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html .nojekyll ./*.js dist/
          printf '%s\n' "$GITHUB_SHA" > dist/release.txt
          test -s dist/index.html
          node --check dist/app.js
          node --check dist/attachments.js
          python3 - <<'PY'
          from pathlib import Path
          root = Path('dist')
          allowed = {'index.html', '.nojekyll', 'release.txt'}
          assets = list(root.iterdir())
          assert assets, 'empty public artifact'
          for asset in assets:
              assert asset.is_file(), f'unexpected directory in public artifact: {asset.name}'
              assert asset.name in allowed or asset.suffix == '.js', f'unexpected public asset: {asset.name}'
          assert (root / 'index.html').stat().st_size > 0
          assert (root / 'app.js').stat().st_size > 0
          assert not any(p.name in {'.env', 'composer.json', 'artisan'} for p in assets)
          print('PASS: public Pages artifact has only allowlisted demo assets')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed public demo over HTTPS
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          case "$PAGE_URL" in
            https://sulaimanalsanani.github.io/aqari-pro/|https://sulaimanalsanani.github.io/aqari-pro) ;;
            *) echo "FAIL: unexpected Pages deployment origin" >&2; exit 1 ;;
          esac
          for asset in index.html app.js attachments.js release.txt; do
            success=0
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --max-time 15 \
                   --retry 0 "${PAGE_URL%/}/$asset" -o /tmp/aqari-pages-asset; then
                if test -s /tmp/aqari-pages-asset; then
                  success=1
                  break
                fi
              fi
              sleep 10
            done
            if [ "$success" -ne 1 ]; then
              echo "FAIL: public demo asset not served: $asset" >&2
              exit 1
            fi
          done
          curl --fail --silent --show-error --location --max-time 15 \
            "${PAGE_URL%/}/index.html" -o /tmp/aqari-pages-index
          grep -q 'عقاري برو' /tmp/aqari-pages-index
          deployed_sha="$(curl --fail --silent --show-error --location --max-time 15 \
            "${PAGE_URL%/}/release.txt" | tr -d '\\r\\n')"
          if [ "$deployed_sha" != "$GITHUB_SHA" ]; then
            echo "FAIL: deployed Pages SHA does not match current commit" >&2
            exit 1
          fi
          echo "PASS: Pages serves commit $GITHUB_SHA and public demo assets over HTTPS"
