name: Deploy Aqari Pro to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check finance.js
          node --check contracts.js
          node --check followups.js
          node --check statements.js
          node --check receipts.js
          node --check reconciliation.js
          node --check maintenance.js
          node --check app.js
          node --check attachments.js
          node --check backend/frontend/api-session.js
          node --check backend/frontend/staging-app.js
      - name: Test financial regression cases
        run: node --test tests/*.test.cjs
      - name: Validate PHP backend source syntax
        run: |
          find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Stage public frontend only
        run: |
          mkdir -p dist
          cp index.html .nojekyll *.js dist/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Allow Pages artifact indexing
        run: sleep 20
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
