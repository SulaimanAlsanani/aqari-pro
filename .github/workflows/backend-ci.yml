name: Backend Laravel Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aqari_test
          POSTGRES_USER: aqari
          POSTGRES_PASSWORD: integration_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqari -d aqari_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: aqari_test
      DB_USERNAME: aqari
      DB_PASSWORD: integration_only_password
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, mbstring, xml, curl, zip, intl
          tools: composer:v2
          coverage: none
      - name: Install PostgreSQL backup and recovery client tools
        run: |
          if ! command -v pg_dump >/dev/null || ! command -v pg_restore >/dev/null || ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          pg_dump --version
          pg_restore --version
      - name: Install verified age CLI without relying on Ubuntu apt mirrors
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 150 \
            --output "$tmp/age.tar.gz" \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          printf '%s  %s\n' \
            'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10' "$tmp/age.tar.gz" | sha256sum --check
          tar -C "$tmp" -xzf "$tmp/age.tar.gz"
          install -m 0755 "$tmp/age/age" "$HOME/.local/bin/age"
          install -m 0755 "$tmp/age/age-keygen" "$HOME/.local/bin/age-keygen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/age" --version
      - name: Run Laravel integration suite and isolated restore rehearsal
        run: bash backend/scripts/ci-test.sh
      - name: Verify encrypted off-site backup with mock S3
        run: bash backend/scripts/ci-encrypted-backup.sh
      - name: Reject missing or stale offsite backups
        run: bash backend/scripts/ci-backup-freshness.sh
