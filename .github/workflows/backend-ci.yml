name: Laravel API checks
on:
  push:
    branches: [feature/production-foundation]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, bcmath, fileinfo
          coverage: none
      - run: composer validate --no-check-publish
      - run: mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate owner portal JavaScript
        run: node --check public/app/app.js
      - name: Validate PHP
        run: find app routes config database tests bootstrap public -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run owner isolation and document security tests
        run: php artisan test
