name: Aqari Pro MFA security tests

on:
  push:
    branches:
      - feature/production-foundation
    paths:
      - 'backend/**'
      - '.github/workflows/mfa-security.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/mfa-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP and SQLite support
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, bcmath, openssl, zip
          tools: composer:v2
          coverage: none
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Validate PHP syntax in MFA-related files
        run: |
          php -l app/Support/Totp.php
          php -l app/Http/Controllers/Api/MfaController.php
          php -l app/Http/Controllers/Api/AuthController.php
          php -l app/Http/Controllers/Api/StagingE2eController.php
          php -l app/Http/Controllers/Api/SessionController.php
          php -l app/Console/Commands/BackupStorageCheck.php
          php -l app/Console/Commands/BackupMake.php
          php -l app/Console/Commands/BackupVerify.php
          php -l app/Console/Commands/BackupStageRestore.php
          php -l app/Console/Commands/BackupStatus.php
          php -l app/Console/Commands/StagingPreflight.php
          php -l app/Console/Commands/StagingServicesCheck.php
          php -l app/Support/BackupMonitorEvents.php
          php -l config/staging.php
          php -l routes/api.php
          php -l routes/console.php
          php -l app/Support/BackupEnvelope.php
          php -l app/Support/RentInstallmentSchedule.php
          php -l app/Support/LeaseDueDates.php
          php -l app/Http/Controllers/Api/PortfolioController.php
          php -l app/Http/Controllers/Api/LeaseRenewalController.php
          php -l app/Http/Controllers/Api/OperationsController.php
          php -l app/Http/Controllers/Api/ExpenseController.php
          php -l app/Http/Controllers/Api/MaintenanceWorkflowController.php
          php -l app/Http/Controllers/Api/HandoverDamageController.php
          php -l app/Support/BackupArchiveValidator.php
          php -l app/Support/BackupAttachmentAudit.php
          php -l app/Support/BackupStagedFilesVerifier.php
          php -l app/Support/MySqlSnapshot.php
          php -l app/Models/User.php
          php -l database/migrations/2026_11_12_120000_add_mfa_to_users_table.php
          php -l database/migrations/2026_11_12_130000_add_mfa_pending_expiry_to_users_table.php
          php -l tests/Feature/OwnerMfaTest.php
          php -l tests/Feature/OwnerPortfolioRecoverySmokeTest.php
          php -l tests/Feature/StagingPreflightTest.php
          php -l tests/Feature/StagingE2eReadinessTest.php
          php -l tests/Feature/StagingServicesCheckTest.php
          php -l tests/Feature/OwnerSessionTest.php
          php -l tests/Feature/BackupStorageCheckTest.php
          php -l tests/Feature/BackupMakeGuardTest.php
          php -l tests/Feature/BackupVerifyTest.php
          php -l tests/Feature/BackupStageRestoreTest.php
          php -l tests/Feature/BackupMySqlStageTest.php
          php -l tests/Feature/BackupAttachmentAuditTest.php
          php -l tests/Feature/BackupStatusTest.php
          php -l tests/Feature/MySqlSnapshotTest.php
          php -l tests/Feature/BackupMonitorEventsTest.php
          php -l tests/Unit/BackupEnvelopeTest.php
          php -l tests/Unit/RentInstallmentScheduleTest.php
          php -l tests/Unit/LeaseDueDatesTest.php
          php -l tests/Feature/RentInstallmentApiTest.php
          php -l tests/Unit/BackupArchiveValidatorTest.php
          php -l tests/Unit/BackupStagedFilesVerifierTest.php
          php -l tests/Unit/TotpTest.php
      - name: Run TOTP vectors and owner MFA integration tests
        run: php artisan test --filter='TotpTest|OwnerMfaTest|OwnerSessionTest|BackupStorageCheckTest|BackupMakeGuardTest|BackupEnvelopeTest|BackupArchiveValidatorTest|BackupVerifyTest|BackupStageRestoreTest|BackupStatusTest|BackupMonitorEventsTest|MySqlSnapshotTest|BackupMySqlStageTest|BackupAttachmentAuditTest|BackupStagedFilesVerifierTest|OwnerPortfolioRecoverySmokeTest|StagingPreflightTest|StagingServicesCheckTest|StagingE2eReadinessTest|RentInstallmentScheduleTest|LeaseDueDatesTest|RentInstallmentApiTest|LeaseLifecycleTest'
      - name: Check portal JavaScript syntax
        run: node --check public/app/app.js
      - name: Validate browser staging target policy and Playwright test syntax
        run: |
          node --check browser-acceptance/playwright.config.cjs
          node --check browser-acceptance/staging-guard.cjs
          node --check browser-acceptance/scripts/run-acceptance.cjs
          node --check browser-acceptance/tests/owner-portal.spec.cjs
          node --check browser-acceptance/tests/owner-write.spec.cjs
          node --test browser-acceptance/tests/staging-guard.test.cjs
      - name: Validate isolated MySQL restore drill syntax and safety
        run: |
          python3 -m py_compile scripts/mysql_isolated_restore.py
          python3 -m unittest discover -s tests -p 'test_mysql_isolated_restore.py' -v

  mysql-isolated-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exercise real offline MySQL import in disposable no-network Docker
        run: |
          set -euo pipefail
          STAGE="backend/storage/app/restore-staging/123e4567-e89b-12d3-a456-426614174000"
          mkdir -p "$STAGE"
          cat > "$STAGE/database.mysql.sql" <<'SQL'
          CREATE DATABASE IF NOT EXISTS aqari_restore_probe;
          USE aqari_restore_probe;
          CREATE TABLE probe (id INT PRIMARY KEY, label VARCHAR(100));
          INSERT INTO probe VALUES (1, 'restored');
          CREATE TABLE documents (
            id BIGINT UNSIGNED PRIMARY KEY,
            user_id BIGINT UNSIGNED NOT NULL,
            path VARCHAR(255) NOT NULL,
            size BIGINT UNSIGNED NOT NULL
          );
          INSERT INTO documents VALUES (1, 7, 'owners/7/documents/proof.pdf', 4);
          CREATE TABLE users (id BIGINT UNSIGNED PRIMARY KEY);
          CREATE TABLE properties (id BIGINT UNSIGNED PRIMARY KEY, user_id BIGINT UNSIGNED NOT NULL);
          CREATE TABLE units (id BIGINT UNSIGNED PRIMARY KEY, property_id BIGINT UNSIGNED NOT NULL);
          CREATE TABLE tenants (id BIGINT UNSIGNED PRIMARY KEY, user_id BIGINT UNSIGNED NOT NULL);
          CREATE TABLE leases (id BIGINT UNSIGNED PRIMARY KEY, unit_id BIGINT UNSIGNED NOT NULL, tenant_id BIGINT UNSIGNED NOT NULL);
          CREATE TABLE payments (id BIGINT UNSIGNED PRIMARY KEY, lease_id BIGINT UNSIGNED NOT NULL);
          CREATE TABLE dues (id BIGINT UNSIGNED PRIMARY KEY, lease_id BIGINT UNSIGNED NOT NULL);
          INSERT INTO users VALUES (7);
          INSERT INTO properties VALUES (10, 7);
          INSERT INTO units VALUES (11, 10);
          INSERT INTO tenants VALUES (12, 7);
          INSERT INTO leases VALUES (13, 11, 12);
          INSERT INTO payments VALUES (14, 13);
          INSERT INTO dues VALUES (15, 13);
          SQL
          mkdir -p "$STAGE/attachments/owners/7/documents"
          printf 'test' > "$STAGE/attachments/owners/7/documents/proof.pdf"
          python3 backend/scripts/mysql_isolated_restore.py \
            --stage "$PWD/$STAGE" --app-storage "$PWD/backend/storage/app"
          rm -rf "$STAGE"

  browser-playwright-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/browser-acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright test runner without browsers
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Run offline staging target and CLI guard tests
        run: npm run check
      - name: Verify read-only test discovery without launching browsers
        env:
          STAGING_BASE_URL: https://staging.ci.invalid
          STAGING_ALLOWED_HOST: staging.ci.invalid
        run: |
          set -euo pipefail
          npm test -- --list > /tmp/aqari-read-specs.txt
          grep -Fq "owner-portal.spec.cjs" /tmp/aqari-read-specs.txt
          if grep -Fq "owner-write.spec.cjs" /tmp/aqari-read-specs.txt; then
            echo "Unsafe: write tests discovered by default" >&2
            exit 1
          fi
      - name: Verify one-time write test is isolated in discovery-only mode
        env:
          STAGING_BASE_URL: https://staging.ci.invalid
          STAGING_ALLOWED_HOST: staging.ci.invalid
          STAGING_TEST_OWNER_EMAIL: aqari-e2e-ci@example.invalid
          STAGING_TEST_OWNER_PASSWORD: synthetic-not-a-real-secret
          STAGING_E2E_WRITE_CONFIRMATION: ALLOW_ONE_TIME_SYNTHETIC_WRITES
        run: |
          set -euo pipefail
          npm run test:write -- --list > /tmp/aqari-write-specs.txt
          grep -Fq "owner-write.spec.cjs" /tmp/aqari-write-specs.txt
          if grep -Fq "owner-portal.spec.cjs" /tmp/aqari-write-specs.txt; then
            echo "Unsafe: read tests discovered in write-only mode" >&2
            exit 1
          fi

  staging-compose-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Render staging configuration with dummy non-production secrets
        env:
          STAGING_APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          STAGING_APP_URL: "https://staging.example.invalid"
          STAGING_DB_PASSWORD: "dummy-ci-only-password"
          STAGING_MYSQL_ROOT_PASSWORD: "dummy-ci-only-root"
          STAGING_MAIL_HOST: "smtp.example.invalid"
          STAGING_MAIL_USERNAME: "ci-staging"
          STAGING_MAIL_PASSWORD: "dummy-ci-mail"
          STAGING_MAIL_FROM_ADDRESS: "noreply@example.invalid"
          STAGING_BACKUP_S3_KEY: "dummy-ci-s3-key"
          STAGING_BACKUP_S3_SECRET: "dummy-ci-s3-secret"
          STAGING_BACKUP_S3_BUCKET: "ci-staging-only"
          STAGING_BACKUP_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: |
          set -euo pipefail
          docker compose -f compose.staging-isolated.yaml config --format json \
            | python3 scripts/check_staging_compose.py
          python3 -m py_compile scripts/check_staging_compose.py
