name: Backend container validation
on:
  push:
    branches: [feature/production-foundation]
    paths:
      - "backend/Dockerfile"
      - "backend/.docker/**"
      - "backend/compose.yaml"
      - "backend/composer.json"
      - "backend/scripts/**"
      - ".github/workflows/backend-container-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-container-ci.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  container:
    runs-on: ubuntu-latest
    env:
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_URL: https://aqari.example.invalid
      DB_PASSWORD: test-only-db-password
      MYSQL_ROOT_PASSWORD: test-only-root-password
      MAIL_MAILER: smtp
      MAIL_HOST: smtp.example.invalid
      MAIL_USERNAME: test@example.invalid
      MAIL_PASSWORD: test-only-mail-password
      MAIL_FROM_ADDRESS: test@example.invalid
    steps:
      - uses: actions/checkout@v4
      - name: Validate backup and container entrypoint scripts
        run: |
          bash -n backend/scripts/backup-encrypted.sh
          bash -n backend/scripts/ci-backup-restore-drill.sh
          bash -n backend/scripts/check-clamav-readiness.sh
          bash -n backend/scripts/check-http-security.sh
          bash -n backend/scripts/ci-clamav-readiness-drill.sh
          bash backend/scripts/ci-clamav-readiness-drill.sh
          sh -n backend/.docker/entrypoint.sh
      - name: Validate production container image build
        run: docker build --progress=plain -t aqari-pro-api:ci backend
      - name: Check compose template syntax
        working-directory: backend
        run: docker compose config --quiet
      - name: Smoke-test running PHP and MySQL containers
        working-directory: backend
        run: |
          docker compose up -d
          docker compose exec -T app clamscan --version
          docker compose exec -T app php artisan migrate --force
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/up >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then docker compose logs --tail=100; exit 1; fi
          curl --fail --silent http://127.0.0.1:8080/app/index.html | grep -q 'عقاري برو'
          status=$(curl --silent -o /dev/null -w '%{http_code}' -H 'Accept: application/json' http://127.0.0.1:8080/api/portfolio)
          test "$status" = "401"
          AQARI_SECURITY_BASE_URL=http://127.0.0.1:8080 bash scripts/check-http-security.sh
      - name: Run bounded concurrent finance and read-performance checks against disposable MySQL
        working-directory: backend
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          AQARI_CONCURRENCY_WRITES: staging-only
          AQARI_CONCURRENCY_URL: http://127.0.0.1:8080
          AQARI_CONCURRENCY_EMAIL: browser.owner@example.test
          AQARI_CONCURRENCY_PASSWORD: ci-browser-password-2026
          AQARI_CONCURRENCY_REQUESTS: "4"
          AQARI_PERF_ACK: staging-only
          AQARI_PERF_URL: http://127.0.0.1:8080
          AQARI_PERF_EMAIL: browser.owner@example.test
          AQARI_PERF_PASSWORD: ci-browser-password-2026
          AQARI_PERF_REQUESTS: "24"
          AQARI_PERF_PARALLEL: "4"
          AQARI_PERF_P95_MS: "5000"
        run: |
          # Strictly a disposable Actions stack. Seed the browser-only owner with
          # APP_ENV=testing; the seeder refuses all normal production environments.
          test "$CI" = "true"
          test "$GITHUB_ACTIONS" = "true"
          docker compose exec -T -e APP_ENV=testing app php artisan db:seed --class=BrowserSmokeSeeder --force
          node scripts/staging-receipt-concurrency.cjs
          node scripts/staging-read-performance.cjs
      - name: Install age for encrypted backup recovery drill
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
      - name: Restore encrypted MySQL and private attachments in isolation
        working-directory: backend
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
        run: bash scripts/ci-backup-restore-drill.sh
      - name: Remove disposable containers after all checks
        if: always()
        working-directory: backend
        run: docker compose down -v --remove-orphans
