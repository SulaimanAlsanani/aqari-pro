/* Aqari Pro | Saudi public-sector inspired design; independent private platform */
:root{--navy:#103f30;--teal:#087448;--bg:#f7f9f8;--line:#e1e8e3;--txt:#203c31;--muted:#647b70;--red:#b93842;--amber:#9c6b14;--focus:#b9944e}
html{font-family:'Cairo',Tahoma,sans-serif}
body{font-family:'Cairo',Tahoma,sans-serif;font-size:13px;font-weight:500;line-height:1.75;letter-spacing:0;background:var(--bg)}
button,input,select,textarea,table{font-family:'Cairo',Tahoma,sans-serif!important}
aside{background:linear-gradient(165deg,#0f4433 0%,#123f32 62%,#0c3329 100%);border-left:3px solid #bc9857;box-shadow:-4px 0 24px #173b2915;padding-top:24px}
aside h1{font-family:'Cairo',sans-serif;font-size:23px;font-weight:800;letter-spacing:-.5px;color:#fff}
aside .hint{font-size:11px;color:#c6ded2}
.navgroup{color:#d6b878;font-size:11px;letter-spacing:0;padding-top:20px}
.navbtn{color:#e1eee7;font-weight:600;border-right:3px solid transparent;transition:background .15s ease,border-color .15s ease}
.navbtn:hover{background:#ffffff18;color:#fff}
.navbtn.active{background:#ffffff1a;color:#fff;border-right-color:#d9b46c;font-weight:800}
.top{background:#fff;border-bottom:1px solid var(--line);border-top:3px solid #b99b61;padding:17px 25px}
.top h2{color:#164c35;font-size:20px;font-weight:800}
.top small{font-size:11px;color:#6a8076}
main{padding:24px}
.metric,.panel,.record{border-radius:11px;border:1px solid #e2e9e4;box-shadow:0 2px 9px #173f2b08}
.metric{border-top:3px solid #c3a364;padding-top:14px}
.metric .num{font-weight:800;color:#164e37}
.panel h3{color:#164d37;font-weight:800}
.title{color:#1a523b}
.btn{background:#087448;border-color:#087448;border-radius:7px;font-weight:700;transition:background .15s ease,transform .15s ease}
.btn:hover{background:#065b39}
.btn.alt{background:#fff;color:#18563d;border-color:#cbdcd0}
.btn.alt:hover{background:#edf6f0}
.btn.danger{color:#b93842}
.badge{font-weight:700;border-radius:6px}
.badge.green{background:#e2f3e9;color:#126640}
.badge.blue{background:#e3f1e9;color:#176547}
.badge.orange{background:#fff3df;color:#805917}
table th{background:#f1f6f2;color:#355b46;font-size:11px;font-weight:800}
table td{border-bottom-color:#e7eee9}
tr:hover td{background:#f9fcfa}
.field label{color:#476e58;font-weight:700}
.field input,.field select,.field textarea,.filters input,.filters select{border-color:#cddcd2;border-radius:7px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid #be9d59;outline-offset:2px}
.modal{border:1px solid #dbe5df;box-shadow:0 20px 55px #09271a3b}
.modalbg{background:#092b1e99}
.callout{background:#edf7f0;border-right-color:#087448}
.bar>span{background:#087448}
pre{background:#143a2c}
.tip{color:#d1ded4}
@media(max-width:740px){aside{border-left:0;border-bottom:3px solid #c5a86a;padding:10px}.navbtn.active{border-right-color:transparent;border-bottom:2px solid #d9b46c}.top{padding:13px 15px}main{padding:12px}}
.attachment-modal{width:min(780px,100%);max-height:90vh;overflow:auto}
.attachment-modal input[type=file]{padding:12px;border:1px dashed #8eaf9b;border-radius:8px;background:#f8fcf9;width:100%;max-width:100%}
.attachment-list{margin-top:14px;max-height:45vh;overflow:auto}
.attachment-item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px;border-bottom:1px solid #e3ece5}
.attachment-item .actions{margin:0;flex-shrink:0}
.attachment-item .btn{font-size:11px;padding:6px 10px}
@media(max-width:600px){.attachment-item{flex-direction:column;align-items:stretch}.attachment-item .actions{justify-content:flex-start}}

.record-attachments{margin-top:10px}
.attachment-summary-heading{color:#087448;font-size:12px;font-weight:800;margin:6px 0}
.attached-file{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0;padding:9px 10px;background:#f3faf5;border:1px solid #d3e9d9;border-radius:8px}
.attached-file-name{color:#15583c;font-weight:700;max-width:100%;overflow-wrap:anywhere}
.attached-file-actions{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
.attached-file-actions .btn{padding:5px 9px;font-size:11px}
.attachment-notice{position:fixed;bottom:20px;left:20px;z-index:20;background:#e9f6ee;color:#08613c;border:1px solid #b8ddc6;border-radius:10px;padding:12px 18px;max-width:min(440px,90vw);font-weight:700;box-shadow:0 9px 30px #112e1d20}
.attachment-notice-error{background:#fff2f0;border-color:#edc6bf;color:#a42c26}
</style></head><body><aside><h1>⌂ عقاري برو</h1><div class="hint">إدارة عقاراتك وإيجاراتك في مكان واحد</div><div class="navlist" id="nav"></div><div class="tip">نسخة تجريبية محلية. تكامل إيجار وضع محاكاة فقط، ولا تتم معالجة مدفوعات فعلية.</div></aside><div class="app"><div class="top"><div><h2 id="title">لوحة القيادة</h2><small>عقاراتي · عقود الإيجار · التحصيل · الصيانة</small></div><span class="badge orange">تكامل إيجار: محاكاة</span></div><main id="content"></main></div><div id="modal"></div><script src="finance.js"></script><script src="contracts.js"></script><script src="followups.js"></script><script src="statements.js"></script><script src="receipts.js"></script><script src="reconciliation.js"></script><script src="maintenance.js"></script><script src="app.js"></script><script src="attachments.js"></script></body></html>
